<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15101C">
<title>Bagara Games | Bagara Biryani Cafe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bungee&family=Archivo:wght@400;700&display=swap">
<style>
:root { --ink: #15101C; --paper: #FFF6E8; --saffron: #FFB61E; --yellow: #FFD400; --magenta: #C8175D; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: "Archivo", Arial, sans-serif; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.brand { font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
h1 { margin: 0 0 8px; font-family: "Bungee", Impact, sans-serif; font-weight: 400; font-size: 34px; line-height: 1; }
a.game { display: flex; flex-direction: column; gap: 6px; padding: 22px 20px; border-radius: 8px; text-decoration: none; color: var(--ink); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--paper); }
a.game b { font-size: 30px; font-weight: 400; line-height: 1.05; }
a.game span { font-size: 16px; }
a.pot { background: var(--saffron); } a.pot b { font-family: "Shrikhand", Georgia, serif; }
a.talkies { background: var(--yellow); } a.talkies b { font-family: "Bungee", Impact, sans-serif; text-transform: uppercase; }
a.game:focus-visible { outline: 3px solid var(--magenta); outline-offset: 4px; }
p { margin: 0; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<main>
  <span class="brand">Bagara Biryani Cafe</span>
  <h1>Play while the bill comes</h1>
  <a class="game pot" href="pot/"><b>What’s your Bagara?</b><span>Your answers cook a biryani. Your selfie seals the dum.</span></a>
  <a class="game talkies" href="talkies/"><b>Bagara Talkies</b><span>Three scenes, one hero shot. You get your own movie poster.</span></a>
  <p>Test version. Nothing you type is saved.</p>
</main>
</body>
</html>
